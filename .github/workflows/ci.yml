name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    # Test on every OS: the agent transport and path handling are
    # platform-specific (unix socket + absolute Include on Linux/macOS, named
    # pipe + forward-slash relative Include on Windows).
    strategy:
      fail-fast: false
      matrix:
        # The Forgejo forge only has Linux runners; other OS jobs would never start there.
        os: ${{ fromJSON(github.server_url == 'https://github.com' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # rustup ships on GitHub-hosted runners but not in the Forgejo node:20-bookworm image.
      - name: Bootstrap rustup
        if: runner.os == 'Linux'
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable
      - name: rustfmt
        if: runner.os == 'Linux' # formatting is OS-independent; check it once
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked

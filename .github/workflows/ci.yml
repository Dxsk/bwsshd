name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    # Test on every OS: the agent transport and path handling are
    # platform-specific (unix socket + absolute Include on Linux/macOS, named
    # pipe + forward-slash relative Include on Windows).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # rustup ships on every GitHub-hosted runner; no third-party action needed.
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable
      - name: rustfmt
        if: runner.os == 'Linux' # formatting is OS-independent; check it once
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked
      # Hosted macOS runners are Apple silicon with a GUI session, so the tray
      # can at least start. No agent runs here: the config stays "absent".
      - name: Tray smoke test
        if: runner.os == 'macOS'
        run: |
          d=$(mktemp -d)
          ./target/debug/bwsshd --tray --interval 2s --out "$d/config.bw" \
            --keydir "$d/keys" --ssh-config "$d/config" --logfile "$d/log" &
          pid=$!
          sleep 10
          cat "$d/log"
          kill -0 "$pid" # still running: the icon and its event loop came up
          kill "$pid"
          grep -q "watching for the Bitwarden agent" "$d/log"
      # The real thing, on a throwaway runner: the LaunchAgent loads, then goes.
      - name: Install and uninstall the LaunchAgent
        if: runner.os == 'macOS'
        run: |
          d=$(mktemp -d)
          ./target/debug/bwsshd install --out "$d/config.bw" --keydir "$d/keys" --ssh-config "$d/config"
          plutil -lint ~/Library/LaunchAgents/fr.infrasouveraine.bwsshd.plist
          launchctl print "gui/$(id -u)/fr.infrasouveraine.bwsshd" | head -n 20
          ./target/debug/bwsshd uninstall
          ! launchctl print "gui/$(id -u)/fr.infrasouveraine.bwsshd" 2>/dev/null
      # Same for the MSI: it installs per user, registers the logon task, and
      # uninstalling removes both.
      - name: MSI install and uninstall
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 20
        run: |
          # A hung msiexec gets killed so its (flushed, UTF-16) log still shows.
          msi() { timeout 300 msiexec "$@" || { tail -c 40000 "${@: -1}" | tr -d '\0'; exit 1; }; }
          cargo build --release --locked
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix build packaging/windows/bwsshd.wxs -arch x64 -ext WixToolset.Util.wixext \
            -d Version=0.0.1 -d Bin=target/release/bwsshd.exe -o bwsshd.msi
          msi //i bwsshd.msi //qn //l*v! install.log
          test -f "$LOCALAPPDATA/Programs/bwsshd/bwsshd.exe"
          schtasks //Query //TN bwsshd //V //FO LIST
          msi //x bwsshd.msi //qn //l*v! uninstall.log
          ! test -e "$LOCALAPPDATA/Programs/bwsshd/bwsshd.exe"
          ! schtasks //Query //TN bwsshd

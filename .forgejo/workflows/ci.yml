name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # The runner image (node:20-bookworm) ships without rustup.
      - name: Bootstrap rustup
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked
      # The Windows setup is built and installed on GitHub; this only checks
      # that the script compiles, with a stand-in for the exe.
      - name: NSIS script
        run: |
          if ! command -v makensis >/dev/null; then
            s=; [ "$(id -u)" = 0 ] || s=sudo
            $s apt-get update -qq && $s apt-get install -y -qq nsis > /dev/null
          fi
          makensis -V2 -DVERSION=0.0.0 "-DBIN=$PWD/LICENSE" -DOUT=/tmp/setup.exe packaging/windows/bwsshd.nsi
